{% extends "base.html" %}
{% block title %}Selamat Datang di HealthMate{% endblock %}

{% block content %}
<div class="container text-center my-5">
    <div class="welcome-animation">
        <h1 class="display-4 fw-bold mb-3">Welcome to <span class="text-primary">HealthMate</span></h1>
        <p class="lead">Layanan kesehatan digital terbaik untuk Anda dan keluarga.</p>
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg me-2">
                <i class="fas fa-sign-in-alt me-1"></i> Login
            </a>
            <a href="{% url 'patient_register' %}" class="btn btn-success btn-lg">
                <i class="fas fa-user-plus me-1"></i> Register
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.welcome-animation {
    animation: fadeInUp 1s ease-in-out;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
{% endblock %}
